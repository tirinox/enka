[project]
name = "enka-backend"
version = "0.1.0"
description = "Enka — cloud backend for personal language-study flashcards"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "pyjwt>=2.10",
    "aiofiles>=24.1",
    # Ollama's REST API for AI-generated definitions/translations — plain
    # HTTP, no SDK needed. Async client keeps the call off the thread pool.
    "httpx>=0.28",
    # Free Spaced Repetition Scheduler. Pure Python; the `optimizer` extra
    # (torch/numpy/pandas) is deliberately not installed.
    "fsrs>=6.3,<7",
    # Local neural TTS for auto-generated term audio. onnxruntime is the only
    # heavy dependency it pulls in at inference time — no torch.
    "piper-tts>=1.7,<2",
    # Language ID for picking a voice. Ships its own compact model, nothing
    # to download separately.
    "py3langid>=0.3,<1",
    # Progress bar for the backfill script (app/scripts/backfill_term_audio.py).
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends()/Query() in defaults is the whole idiom
    "BLE001",  # broad excepts here are deliberate and commented
    # `str, Enum` rather than `StrEnum`: str(Member) must keep returning the
    # qualified name, because these values end up in storage paths and logs.
    "UP042",
    "UP046",   # Generic[T] reads clearly and matches the Pydantic docs
    # Prose in docstrings and API descriptions uses real typographic dashes.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures and tests must share one loop: the session-scoped engine and the
# per-test connection bound to it cannot cross event loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# The project is not pip-installed into the image (the source is bind-mounted),
# so put the working directory on sys.path for `app` and `tests` imports.
pythonpath = ["."]
markers = ["slow: excluded from the default run with -m 'not slow'"]
